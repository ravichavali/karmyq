name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  checks: write
  pull-requests: read

env:
  NODE_VERSION: '24.x'

jobs:
  # Test backend services
  test-backend:
    name: Test Backend Services (Unit + Regression)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit + regression tests (TDD Framework)
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret

      - name: Integration tests info
        run: |
          echo "ℹ️  Unit + regression tests passed"
          echo "ℹ️  Integration tests run in separate job with Docker Compose"
          echo "ℹ️  See test-integration job for service-to-service testing"

  # Lint and type-check
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: |
          npm run type-check --workspace=packages/shared --if-present
          npm run type-check --workspace=services/auth-service --if-present
          npm run type-check --workspace=services/community-service --if-present

      - name: Run linter
        run: npm run lint --if-present || echo "⚠️  Linter found issues but continuing (non-blocking)"

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Run npm audit (blocking — no high/critical vulns; see ADR-059)
        run: npm audit --package-lock-only --audit-level=high

      - name: Install dependencies
        run: npm ci

      - name: Verify registry provenance (npm audit signatures — informational; ADR-061)
        run: npm audit signatures || echo "::warning::npm audit signatures reported issues (non-blocking; see ADR-061)"

      - name: OSV-Scanner (supply-chain advisory scan — informational; ADR-061)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=package-lock.json

  # Code scanning gate — blocks on open critical/high CodeQL alerts (ADR-060)
  code-scanning-gate:
    name: Code Scanning Gate (ADR-060)
    runs-on: ubuntu-latest
    permissions:
      security-events: read
    steps:
      - name: Fail on open critical/high CodeQL alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # CodeQL runs via GitHub default setup and is async, so poll for an
          # analysis on this SHA with a bounded timeout. Fail-open ONLY when no
          # analysis exists yet; never fail-open on present findings (ADR-060).
          analyses=0
          for i in $(seq 1 10); do
            analyses=$(gh api "repos/${{ github.repository }}/code-scanning/analyses?ref=${{ github.ref }}&sha=${{ github.sha }}&per_page=1" --jq 'length' 2>/dev/null || echo 0)
            [ "${analyses:-0}" -gt 0 ] && break
            echo "No analysis yet for ${{ github.sha }} (attempt $i) — waiting…"; sleep 30
          done
          if [ "${analyses:-0}" -eq 0 ]; then
            echo "::warning::No code-scanning analysis available for this SHA within timeout — passing (fail-open on missing analysis, see ADR-060)."
            exit 0
          fi
          # Severity filtering done in jq (the alerts endpoint's severity filter is unreliable).
          open=$(gh api "repos/${{ github.repository }}/code-scanning/alerts?ref=${{ github.ref }}&state=open&per_page=100" --paginate \
            --jq '.[] | select(.rule.security_severity_level=="critical" or .rule.security_severity_level=="high") | .number' | wc -l)
          if [ "$open" -gt 0 ]; then
            echo "::error::$open open critical/high code-scanning alert(s) — blocking (ADR-060)."
            gh api "repos/${{ github.repository }}/code-scanning/alerts?ref=${{ github.ref }}&state=open&per_page=100" --paginate \
              --jq '.[] | select(.rule.security_severity_level=="critical" or .rule.security_severity_level=="high") | "  - #\(.number) \(.rule.id) \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"'
            exit 1
          fi
          echo "Code-scanning gate clean: 0 open critical/high (ADR-060)."

  # Build and verify landing page
  build-landing:
    name: Build Landing Page
    runs-on: ubuntu-latest
    needs: [test-backend]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate docs and build landing page
        run: cd apps/landing && npm run build

      - name: Verify docs output
        run: |
          test -f apps/landing/out/docs/index.html || (echo "FAIL: docs/index.html missing" && exit 1)
          test -d apps/landing/out/docs/services || (echo "FAIL: docs/services/ missing" && exit 1)
          test -d apps/landing/out/docs/concepts || (echo "FAIL: docs/concepts/ missing" && exit 1)
          echo "Landing page build verified: docs pages present"

  # Integration tests
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-backend]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start test environment
        run: |
          cd tests
          docker compose -f docker-compose.test.yml up -d
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Check service health
        run: |
          cd tests
          docker compose -f docker-compose.test.yml ps

      - name: Run integration tests
        run: |
          cd tests
          npm run test:integration
        env:
          DOCKER_ENV: test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-results
          path: tests/coverage/integration

      - name: Show logs on failure
        if: failure()
        run: |
          cd tests
          docker compose -f docker-compose.test.yml logs

      - name: Cleanup test environment
        if: always()
        run: |
          cd tests
          docker compose -f docker-compose.test.yml down -v

  # Build Docker images
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, lint, test-integration, build-landing, security, code-scanning-gate]

    strategy:
      matrix:
        service:
          - auth-service
          - community-service
          - request-service
          - reputation-service
          - notification-service
          - messaging-service
          - feed-service
          - cleanup-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          tags: karmyq-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Demo environment (automatic with integration tests)
  deploy-demo:
    name: Deploy to Demo
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: demo
      url: https://karmyq.com

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Pre-deploy cleanup
        run: |
          ssh ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'ENDSSH'
            cd ~/karmyq
            # Remove Docker build artifacts with root ownership that block git operations
            sudo rm -rf services/geocoding-service/services/ 2>/dev/null || true
            # Hard reset server to exactly match origin/master — restores any missing/corrupt files
            git fetch origin master
            git reset --hard origin/master
            git clean -ffd --exclude='.env*' --exclude='*.log' 2>/dev/null || true
          ENDSSH

      - name: Deploy to karmyq.com
        run: |
          ssh ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'ENDSSH'
            set -e

            echo "🚀 Deploying to karmyq.com..."
            cd ~/karmyq

            # Run deployment (integration tests already passed in CI)
            SKIP_TESTS=1 ./scripts/deploy.sh

            echo "✅ Deployment complete"
          ENDSSH

      - name: Wait for services to stabilize
        run: sleep 15

      - name: Health check all services
        run: |
          echo "🏥 Running health checks..."

          ssh ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'ENDSSH'
            services=(
              "3001:auth-service"
              "3002:community-service"
              "3003:request-service"
              "3004:reputation-service"
              "3005:notification-service"
              "3006:messaging-service"
              "3007:feed-service"
              "3008:cleanup-service"
              "3009:geocoding-service"
              "3010:social-graph-service"
            )

            all_healthy=true

            for service in "${services[@]}"; do
              port=$(echo $service | cut -d: -f1)
              name=$(echo $service | cut -d: -f2)

              if curl -f -s http://localhost:$port/health >/dev/null 2>&1; then
                echo "✅ $name is healthy"
              else
                echo "❌ $name health check failed"
                all_healthy=false
              fi
            done

            if [ "$all_healthy" != "true" ]; then
              echo "❌ Some services are unhealthy"
              exit 1
            fi

            echo "✅ All services healthy"
          ENDSSH

      - name: Deployment summary
        if: success()
        run: |
          echo "🎉 Demo Deployment Successful"
          echo ""
          echo "Environment: https://karmyq.com"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "Quality gates that passed:"
          echo "  ✅ Unit + regression tests"
          echo "  ✅ Integration tests (Docker Compose)"
          echo "  ✅ TypeScript type checking"
          echo "  ✅ Security audit (npm audit)"
          echo "  ✅ Landing page build + docs verification"
          echo "  ✅ Docker image builds"
          echo "  ✅ Service health verification"
          echo "  ✅ Auto-rollback capability"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Demo Deployment Failed"
          echo ""
          echo "The deployment was automatically rolled back."
          echo "Check the logs above for details."
          echo ""
          echo "To deploy manually:"
          echo "  ssh ubuntu@karmyq.com"
          echo "  cd ~/karmyq"
          echo "  ./scripts/deploy.sh"
