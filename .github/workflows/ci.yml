name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  NODE_VERSION: '20.x'

jobs:
  # Test backend services
  test-backend:
    name: Test Backend Services
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: karmyq_user
          POSTGRES_PASSWORD: karmyq_password_dev
          POSTGRES_DB: karmyq_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --workspace=packages/shared
          npm ci --workspace=tests

      - name: Initialize database
        run: |
          PGPASSWORD=karmyq_password_dev psql -h localhost -U karmyq_user -d karmyq_db -f infrastructure/postgres/init.sql

      - name: Run integration tests
        run: npm run test --workspace=tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://karmyq_user:karmyq_password_dev@localhost:5432/karmyq_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret

  # Lint and type-check
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: |
          npm run type-check --workspace=packages/shared --if-present
          npm run type-check --workspace=services/auth-service --if-present
          npm run type-check --workspace=services/community-service --if-present

      - name: Run linter
        run: npm run lint --if-present

  # Build Docker images
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, lint]

    strategy:
      matrix:
        service:
          - auth-service
          - community-service
          - request-service
          - reputation-service
          - notification-service
          - messaging-service
          - feed-service
          - cleanup-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: false
          tags: karmyq-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to QA environment
  deploy-qa:
    name: Deploy to QA
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.QA_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.QA_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to QA server
        run: |
          ssh ${{ secrets.QA_SERVER_USER }}@${{ secrets.QA_SERVER_HOST }} << 'EOF'
            cd ~/karmyq-qa
            git pull origin develop
            docker-compose -f infrastructure/docker/docker-compose.qa.yml pull
            docker-compose -f infrastructure/docker/docker-compose.qa.yml up -d
            docker-compose -f infrastructure/docker/docker-compose.qa.yml exec -T postgres psql -U karmyq_user -d karmyq_db -c "SELECT 1"
          EOF

      - name: Health check
        run: |
          sleep 10
          curl -f http://${{ secrets.QA_SERVER_HOST }}:3001/health || exit 1
          curl -f http://${{ secrets.QA_SERVER_HOST }}:3002/health || exit 1

  # Deploy to Production (manual approval required)
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://karmyq.com

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to production
        run: echo "Production deployment would go here"
        # Add production deployment steps when ready
