name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read
  checks: write
  pull-requests: read

env:
  NODE_VERSION: '24.x'

jobs:
  # Test backend services
  test-backend:
    name: Test Backend Services (Unit + Regression)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit + regression tests (TDD Framework)
        run: npm test
        env:
          NODE_ENV: test
          JWT_SECRET: test_jwt_secret

      - name: Integration tests info
        run: |
          echo "ℹ️  Unit + regression tests passed"
          echo "ℹ️  Integration tests run in separate job with Docker Compose"
          echo "ℹ️  See test-integration job for service-to-service testing"

  # Lint and type-check
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        # Explicit `shell: bash` gives `--noprofile --norc -eo pipefail`, so any
        # failing line fails the step. A custom template like `bash {0}` would
        # drop those flags and let an early failure be masked by a later
        # success — the step's exit code would be the LAST command's.
        shell: bash
        run: |
          npm run type-check --workspace=packages/shared
          npm run type-check --workspace=services/auth-service
          npm run type-check --workspace=services/community-service
          npm run type-check --workspace=services/messaging-service
          npm run type-check --workspace=apps/mobile

      - name: Run linter
        run: npm run lint --if-present || echo "⚠️  Linter found issues but continuing (non-blocking)"

  # Security audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Run npm audit (blocking — no high/critical vulns; see ADR-059)
        run: npm audit --package-lock-only --audit-level=high

      - name: Install dependencies
        run: npm ci

      - name: Verify registry provenance (npm audit signatures — informational; ADR-061)
        run: npm audit signatures || echo "::warning::npm audit signatures reported issues (non-blocking; see ADR-061)"

      - name: OSV-Scanner (supply-chain advisory scan — informational; ADR-061)
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --lockfile=package-lock.json

  # Code scanning gate — blocks on open critical/high CodeQL alerts (ADR-060)
  code-scanning-gate:
    name: Code Scanning Gate (ADR-060)
    runs-on: ubuntu-latest
    permissions:
      security-events: read
    steps:
      - name: Fail on open critical/high CodeQL alerts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # CodeQL default setup publishes analyses to refs/pull/N/HEAD and the HEAD sha.
          # On a pull_request event github.ref is refs/pull/N/MERGE and github.sha is the
          # ephemeral merge commit, so querying those matches nothing on every PR — the gate
          # then fail-opens and has never blocked a pull request. Resolve the scan target
          # explicitly per event type instead. (ADR-060)
          SCAN_REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/head', github.event.number) || github.ref }}
          SCAN_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -o pipefail
          # CodeQL runs via GitHub default setup and is async, so poll with a bounded timeout.
          # Fail-open ONLY when an analysis is genuinely absent; never on findings, and never
          # on an API error — an error means we could not establish the state at all (ADR-060).
          echo "Scan target: ref=$SCAN_REF sha=$SCAN_SHA (event: $GITHUB_EVENT_NAME)"

          # WHICH analyses must exist comes from the live default-setup config, not a
          # hand-maintained list — a shadow map would drift and silently narrow the gate.
          # javascript / typescript / javascript-typescript all publish under the single
          # category "javascript-typescript".
          if ! expected=$(gh api "repos/${{ github.repository }}/code-scanning/default-setup" \
                --jq '[.languages[] | if . == "javascript" or . == "typescript" then "javascript-typescript" else . end] | unique | .[]'); then
            echo "::error::Could not read code-scanning default setup — cannot establish which analyses to require; refusing to fail open (ADR-060)."
            exit 1
          fi
          echo "Required analysis categories:"; for c in $expected; do echo "  - $c"; done

          # Wait for EVERY expected category on this exact SHA. Breaking on the first analysis
          # to appear would pass before (e.g.) javascript-typescript has run, letting a late
          # high/critical escape — observed on PR #195, where actions landed 66s before it.
          missing=""
          for i in $(seq 1 10); do
            if ! raw=$(gh api "repos/${{ github.repository }}/code-scanning/analyses?ref=$SCAN_REF&sha=$SCAN_SHA&per_page=100" --paginate --jq '.[].category'); then
              echo "::error::code-scanning analyses query FAILED (API error, not an empty result) — refusing to fail open (ADR-060)."
              exit 1
            fi
            got=$(printf '%s\n' "$raw" | sed 's|^/language:||' | sort -u)
            missing=""
            for c in $expected; do
              printf '%s\n' "$got" | grep -qx "$c" || missing="$missing $c"
            done
            [ -z "$missing" ] && break
            echo "Waiting for analyses:$missing (attempt $i)"; sleep 30
          done

          if [ -n "$missing" ]; then
            echo "::warning::Missing code-scanning analyses for$missing at $SCAN_REF@$SCAN_SHA within timeout — passing (fail-open on MISSING analysis only, see ADR-060)."
            exit 0
          fi
          echo "All required analyses present for $SCAN_SHA."
          # Severity filtering done in jq (the alerts endpoint's severity filter is unreliable).
          # Fetched ONCE: the count and the listing must never be able to disagree, which two
          # separately-maintained copies of this filter would eventually allow.
          # Same rule as the poll: an API error is not "no alerts". Guard explicitly rather than
          # leaning on `set -e`, so the behaviour holds regardless of how the shell is invoked.
          if ! alerts=$(gh api "repos/${{ github.repository }}/code-scanning/alerts?ref=$SCAN_REF&state=open&per_page=100" --paginate \
                --jq '.[] | select(.rule.security_severity_level=="critical" or .rule.security_severity_level=="high") | "  - #\(.number) \(.rule.id) \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"'); then
            echo "::error::code-scanning alerts query FAILED (API error, not an empty result) — refusing to report the gate clean (ADR-060)."
            exit 1
          fi
          if [ -n "$alerts" ]; then
            echo "::error::$(printf '%s\n' "$alerts" | wc -l) open critical/high code-scanning alert(s) — blocking (ADR-060)."
            printf '%s\n' "$alerts"
            exit 1
          fi
          echo "Code-scanning gate clean: 0 open critical/high (ADR-060)."

  # Build and verify landing page
  build-landing:
    name: Build Landing Page
    runs-on: ubuntu-latest
    needs: [test-backend]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate docs and build landing page
        run: cd apps/landing && npm run build

      - name: Verify docs output
        run: |
          test -f apps/landing/out/docs/index.html || (echo "FAIL: docs/index.html missing" && exit 1)
          test -d apps/landing/out/docs/services || (echo "FAIL: docs/services/ missing" && exit 1)
          test -d apps/landing/out/docs/concepts || (echo "FAIL: docs/concepts/ missing" && exit 1)
          echo "Landing page build verified: docs pages present"

      # v11.35.0 shipped a landing site that declared font-family: Fraunces but never loaded it:
      # `@import 'tailwindcss'` sat above the Google Fonts @import, so after Tailwind v4 inlined the
      # framework the font import was no longer first, became invalid, and the optimizer dropped it
      # silently. The build succeeded and every test passed. A rendered-page check cannot see this —
      # an unloaded font computes the same `font-family` string as a loaded one — so the assertions
      # are against the built bundle.
      #
      # This runs the real regression suite HERE rather than reimplementing its checks in bash: the
      # build output only exists in this job, and a grep for the hostname would not enforce that the
      # match is an actual @import, that there is exactly one, or that it precedes the first rule
      # (an @import after the first rule is silently ignored by browsers — i.e. still broken).
      #
      # REQUIRE_LANDING_BUILD makes a missing build a FAILURE instead of a skip, so the check cannot
      # pass vacuously. It is deliberately not keyed on `CI`, which Actions sets in every job —
      # including the general test job, which has no landing build and must still skip these.
      - name: Verify landing production CSS (v11.35.0 font regression)
        env:
          REQUIRE_LANDING_BUILD: '1'
        run: cd tests && npx jest regression/landing-production-css --verbose

  # Integration tests
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-backend]

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Start test environment
        run: |
          cd tests
          docker compose -f docker-compose.test.yml up -d
          echo "Waiting for services to be healthy..."
          sleep 30

      - name: Check service health
        run: |
          cd tests
          docker compose -f docker-compose.test.yml ps

      # ADR-087: init.sql is generated from the migration chain. Replay the chain before integration
      # tests and fail if a normalized schema-only dump changes at all; sentinels remain defense in
      # depth. This catches new cleanly-applied objects as well as unexpected migration errors.
      - name: Prove init.sql matches the full migrated schema
        run: bash scripts/ci-apply-full-schema.sh --drift-check

      - name: Run integration tests
        run: |
          cd tests
          npm run test:integration
        env:
          DOCKER_ENV: test

      # Sprint 117: the curated full-reset destructive path must execute (twice) in migrated
      # Postgres before it can ever run against the live demo. Placed LAST so the full wipe does
      # not perturb the integration suite above. Runs the single file directly (not the whole tdd
      # tier) so unrelated WIP tests cannot mask or fail this gate.
      - name: Sprint 117 curated reset integration
        run: |
          cd tests
          npx jest tdd/sprint-117-demo-reset.integration.test.ts --runInBand --forceExit
        env:
          NODE_ENV: test
          DOCKER_ENV: test
          DEMO_RESET_MARKER: karmyq-demo-reset-v1
          DATABASE_URL: postgresql://karmyq_test:test_password@localhost:5433/karmyq_test

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: integration-test-results
          path: tests/coverage/integration

      - name: Show logs on failure
        if: failure()
        run: |
          cd tests
          docker compose -f docker-compose.test.yml logs

      - name: Cleanup test environment
        if: always()
        run: |
          cd tests
          docker compose -f docker-compose.test.yml down -v

  # Build Docker images
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, lint, test-integration, build-landing, security, code-scanning-gate]

    strategy:
      matrix:
        service:
          - auth-service
          - community-service
          - request-service
          - reputation-service
          - notification-service
          - messaging-service
          - cleanup-service

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./services/${{ matrix.service }}/Dockerfile
          push: false
          tags: karmyq-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Demo environment (automatic with integration tests)
  deploy-demo:
    name: Deploy to Demo
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    # Serialize deploys to the single demo server. Without this, multiple master
    # pushes (e.g. several PR merges in quick succession) run deploy.sh concurrently
    # in the same ~/karmyq dir and corrupt each other's node_modules (ENOTEMPTY).
    # cancel-in-progress: false → queue and run one at a time, never abort a deploy.
    concurrency:
      group: deploy-demo
      cancel-in-progress: false
    environment:
      name: demo
      url: https://karmyq.com

    steps:
      - uses: actions/checkout@v7

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Pre-deploy cleanup
        run: |
          ssh ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'ENDSSH'
            cd ~/karmyq
            # Remove Docker build artifacts with root ownership that block git operations
            sudo rm -rf services/geocoding-service/services/ 2>/dev/null || true
            # Hard reset server to exactly match origin/master — restores any missing/corrupt files
            git fetch origin master
            git reset --hard origin/master
            git clean -ffd --exclude='.env*' --exclude='*.log' 2>/dev/null || true
          ENDSSH

      - name: Deploy to karmyq.com
        run: |
          ssh ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'ENDSSH'
            set -e

            echo "🚀 Deploying to karmyq.com..."
            cd ~/karmyq

            # Run deployment (integration tests already passed in CI)
            SKIP_TESTS=1 ./scripts/deploy.sh

            echo "✅ Deployment complete"
          ENDSSH

      - name: Wait for services to stabilize
        run: sleep 15

      - name: Health check all services
        run: |
          echo "🏥 Running health checks..."

          ssh ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'ENDSSH'
            services=(
              "3001:auth-service"
              "3002:community-service"
              "3003:request-service"
              "3004:reputation-service"
              "3005:notification-service"
              "3006:messaging-service"
              "3008:cleanup-service"
              "3009:geocoding-service"
              "3010:social-graph-service"
            )

            all_healthy=true

            for service in "${services[@]}"; do
              port=$(echo $service | cut -d: -f1)
              name=$(echo $service | cut -d: -f2)

              if curl -f -s http://localhost:$port/health >/dev/null 2>&1; then
                echo "✅ $name is healthy"
              else
                echo "❌ $name health check failed"
                all_healthy=false
              fi
            done

            if [ "$all_healthy" != "true" ]; then
              echo "❌ Some services are unhealthy"
              exit 1
            fi

            echo "✅ All services healthy"
          ENDSSH

      - name: Deployment summary
        if: success()
        run: |
          echo "🎉 Demo Deployment Successful"
          echo ""
          echo "Environment: https://karmyq.com"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "Quality gates that passed:"
          echo "  ✅ Unit + regression tests"
          echo "  ✅ Integration tests (Docker Compose)"
          echo "  ✅ TypeScript type checking"
          echo "  ✅ Security audit (npm audit)"
          echo "  ✅ Landing page build + docs verification"
          echo "  ✅ Docker image builds"
          echo "  ✅ Service health verification"
          echo "  ✅ Auto-rollback capability"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Demo Deployment Failed"
          echo ""
          echo "The deployment was automatically rolled back."
          echo "Check the logs above for details."
          echo ""
          echo "To deploy manually:"
          echo "  ssh ubuntu@karmyq.com"
          echo "  cd ~/karmyq"
          echo "  ./scripts/deploy.sh"
