name: CI/CD Pipeline

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

env:
  NODE_VERSION: '20.x'

jobs:
  # Test backend services
  test-backend:
    name: Test Backend Services
    runs-on: ubuntu-latest  # Service containers require Linux runner

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: karmyq_user
          POSTGRES_PASSWORD: karmyq_password_dev
          POSTGRES_DB: karmyq_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: |
          npm ci --workspace=packages/shared
          npm ci --workspace=services/auth-service
          npm ci --workspace=tests

      - name: Initialize database
        run: |
          PGPASSWORD=karmyq_password_dev psql -h localhost -U karmyq_user -d karmyq_db -f infrastructure/postgres/init.sql

      - name: Run integration tests
        run: npm run test --workspace=tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://karmyq_user:karmyq_password_dev@localhost:5432/karmyq_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret

  # Lint and type-check
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript type check
        run: |
          npm run type-check --workspace=packages/shared --if-present
          npm run type-check --workspace=services/auth-service --if-present
          npm run type-check --workspace=services/community-service --if-present

      - name: Run linter
        run: npm run lint --if-present

  # Build Docker images
  build-images:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [test-backend, lint]

    strategy:
      matrix:
        service:
          - auth-service
          - community-service
          - request-service
          - reputation-service
          - notification-service
          - messaging-service
          - feed-service
          - cleanup-service

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          context: ./services/${{ matrix.service }}
          push: false
          tags: karmyq-${{ matrix.service }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Deploy to Production (automatic with integration tests)
  deploy-prod:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    environment:
      name: production
      url: https://karmyq.com

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.PROD_SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to karmyq.com
        run: |
          ssh ${{ secrets.PROD_SERVER_USER }}@${{ secrets.PROD_SERVER_HOST }} << 'ENDSSH'
            set -e

            echo "🚀 Deploying to karmyq.com..."
            cd ~/karmyq

            # Run the enhanced deployment script
            # It will automatically:
            # - Pull latest code
            # - Install hooks
            # - Run integration tests
            # - Build and deploy if tests pass
            # - Rollback if tests fail
            ./scripts/deploy.sh

            echo "✅ Deployment complete"
          ENDSSH

      - name: Wait for services to stabilize
        run: sleep 15

      - name: Health check all services
        run: |
          echo "🏥 Running health checks..."

          services=(
            "3001:auth-service"
            "3002:community-service"
            "3003:request-service"
            "3004:reputation-service"
            "3005:notification-service"
            "3006:messaging-service"
            "3007:feed-service"
            "3008:cleanup-service"
            "3009:geocoding-service"
            "3010:social-graph-service"
          )

          all_healthy=true

          for service in "${services[@]}"; do
            port=$(echo $service | cut -d: -f1)
            name=$(echo $service | cut -d: -f2)

            if curl -f -s https://karmyq.com:$port/health >/dev/null 2>&1; then
              echo "✅ $name is healthy"
            else
              echo "❌ $name health check failed"
              all_healthy=false
            fi
          done

          if [ "$all_healthy" != "true" ]; then
            echo "❌ Some services are unhealthy"
            exit 1
          fi

          echo "✅ All services healthy"

      - name: Deployment summary
        if: success()
        run: |
          echo "🎉 Production Deployment Successful"
          echo ""
          echo "Environment: https://karmyq.com"
          echo "Commit: ${{ github.sha }}"
          echo ""
          echo "Safety features that ran:"
          echo "  ✅ Integration tests (on production DB)"
          echo "  ✅ Auto-rollback capability"
          echo "  ✅ Health verification"
          echo "  ✅ Git hooks installed"

      - name: Notify on failure
        if: failure()
        run: |
          echo "❌ Production Deployment Failed"
          echo ""
          echo "The deployment was automatically rolled back."
          echo "Check the logs above for details."
          echo ""
          echo "To deploy manually:"
          echo "  ssh ubuntu@karmyq.com"
          echo "  cd ~/karmyq"
          echo "  ./scripts/deploy.sh"
