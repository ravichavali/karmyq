name: Expo SDK drift

# Sprint 122 PR 3. `tests/regression/sprint-122-expo-sdk-alignment.test.ts` freezes the
# SDK-managed versions in a handwritten `SDK_PINNED` map. That map is a SHADOW of a live,
# mutable source -- Expo revises its version matrix *within* an SDK generation. On
# 2026-08-03 it moved react-native-gesture-handler ~2.32.0 -> ~3.1.0 and the gate stayed
# 8/8 green, because it compares the manifest against the shadow: two local files that
# still agreed with each other.
#
# `npx expo install --check` is the real arbiter. This job runs it against the live map
# so the drift is detected by CI rather than by a human happening to re-read the source.
#
# Deliberately NOT a pull_request trigger: that would make every merge depend on
# api.expo.dev being reachable. Drift is a "fix within a day" problem, not a
# "block this merge" problem, so it runs on a schedule and files an issue.

on:
  schedule:
    # 07:15 UTC daily. Off the hour to avoid GitHub's peak-of-hour scheduling backlog.
    - cron: "15 7 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

env:
  NODE_VERSION: "24.x"
  DRIFT_LABEL: expo-sdk-drift

jobs:
  check-expo-alignment:
    name: Check apps/mobile against Expo's live SDK map
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run the arbiter and divergence gate
        id: check
        working-directory: apps/mobile
        env:
          EXPO_NO_TELEMETRY: "1"
        run: |
          set +e
          npx expo install --check > "$RUNNER_TEMP/expo-check.log" 2>&1
          status=$?
          set -e
          cat "$RUNNER_TEMP/expo-check.log"

          set +e
          EXPO_CHECK_STATUS="$status" node -e '
          const fs = require("fs");
          const gate = require("../../scripts/expo-divergences.js");
          let result;
          try {
            result = gate.evaluate(
              {
                status: Number(process.env.EXPO_CHECK_STATUS),
                signal: null,
                output: fs.readFileSync(0, "utf8"),
              },
              gate.readRegistry(),
            );
          } catch (error) {
            result = {
              ok: false,
              errors: [error.message],
              blocking: [],
              cleared: [],
              stale: [],
            };
          }

          for (const entry of result.cleared) {
            console.log(
              `REGISTERED DIVERGENCE: ${entry.package} ${entry.declared} (Expo pins ${entry.expoPins})`,
            );
          }
          for (const error of result.errors) console.error(`ERROR: ${error}`);
          for (const drift of result.blocking) {
            console.error(
              `BLOCKING: ${drift.package}@${drift.installed} (Expo expects ${drift.expoPins})`,
            );
          }

          const issueWorthy =
            result.blocking.length > 0 ||
            result.errors.some((error) => /recorded expoPins/.test(error));
          console.log(
            `result=${Buffer.from(JSON.stringify(result), "utf8").toString("base64")}`,
          );
          console.log(`issue=${issueWorthy ? 1 : 0}`);
          process.exitCode = result.ok ? 0 : 1;
          ' < "$RUNNER_TEMP/expo-check.log" > "$RUNNER_TEMP/expo-gate.log" 2>&1
          gate_status=$?
          set -e
          cat "$RUNNER_TEMP/expo-gate.log"

          result=$(sed -n 's/^result=//p' "$RUNNER_TEMP/expo-gate.log")
          issue=$(sed -n 's/^issue=//p' "$RUNNER_TEMP/expo-gate.log")
          if [ -z "$result" ]; then
            echo "Divergence gate did not emit a result payload." >&2
            result=$(node -e '
            const result = {
              ok: false,
              errors: ["Divergence gate did not emit a result payload"],
              blocking: [],
              cleared: [],
              stale: [],
            };
            process.stdout.write(Buffer.from(JSON.stringify(result), "utf8").toString("base64"));
            ')
            gate_status=1
          fi
          if [ "$issue" != "1" ]; then
            issue=0
          fi

          echo "status=$gate_status" >> "$GITHUB_OUTPUT"
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "issue=$issue" >> "$GITHUB_OUTPUT"

          if [ "$gate_status" -eq 0 ]; then
            echo "✅ Expo divergence gate is green."
          else
            echo "::warning::Expo divergence gate failed; review this run's gate output."
          fi

      - name: File or update the drift issue
        if: steps.check.outputs.issue == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RESULT: ${{ steps.check.outputs.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # Ensure the label exists before searching or creating with it.
          gh label create "$DRIFT_LABEL" \
            --description "apps/mobile has drifted from Expo's live SDK version map" \
            --color 'B60205' 2>/dev/null || true

          details=$(node -e '
          const result = JSON.parse(Buffer.from(process.env.RESULT, "base64").toString("utf8"));
          const sections = [];
          if (result.errors.length) {
            sections.push("### Gate errors\n" + result.errors.map((error) => `- ${error}`).join("\n"));
          }
          if (result.blocking.length) {
            sections.push(
              "### Blocking drift\n" +
                result.blocking
                  .map((drift) => `- ${drift.package}@${drift.installed} — Expo expects ${drift.expoPins}`)
                  .join("\n"),
            );
          }
          if (result.stale.length) {
            sections.push(
              "### Stale divergence registrations\n" +
                result.stale.map((entry) => `- ${entry.package} ${entry.declared}`).join("\n"),
            );
          }
          sections.push(
            "### Cleared registered divergences\n" +
              (result.cleared.length
                ? result.cleared
                    .map(
                      (entry) =>
                        `- ${entry.package} ${entry.declared} — Expo pins ${entry.expoPins}`,
                    )
                    .join("\n")
                : "- None"),
          );
          process.stdout.write(sections.join("\n\n"));
          ')

          body=$(cat <<EOF
          The Expo divergence gate rejected the result from \`npx expo install --check\`
          against Expo's **live** version map.

          $details

          **To fix:**
          1. For blocking drift, update \`apps/mobile/package.json\` and the matching
             \`SDK_PINNED\` entry, with a written reason.
          2. For a stale or mismatched registration, update or remove the entry in
             \`security/expo-divergences.json\`; never widen it to hide new drift.
          3. Re-resolve the lockfile surgically and assert the resolved version.
          4. Re-run \`node scripts/expo-divergences.js\`, mobile tests, and \`tsc --noEmit\`.

          Run: $RUN_URL
          EOF
          )

          existing=$(gh issue list --state open --label "$DRIFT_LABEL" \
            --json number --jq '.[0].number // empty')

          if [ -n "$existing" ]; then
            echo "Updating existing issue #$existing"
            gh issue comment "$existing" --body "$body"
          else
            echo "Filing a new drift issue"
            gh issue create \
              --title "Expo SDK drift: apps/mobile no longer matches Expo's live version map" \
              --label "$DRIFT_LABEL" \
              --body "$body"
          fi

      - name: Close stale drift issues when the gate is green
        if: steps.check.outputs.status == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list --state open --label "$DRIFT_LABEL" \
            --json number --jq '.[].number')

          if [ -n "$existing" ]; then
            for issue in $existing; do
              echo "Closing resolved drift issue #$issue"
              gh issue close "$issue" \
                --comment "The Expo divergence gate is green again. Verified by $RUN_URL."
            done
          else
            echo "No stale Expo drift issue is open."
          fi

      - name: Fail the run when drift is present
        if: steps.check.outputs.status != '0'
        run: |
          echo "Expo SDK drift detected; failing so the scheduled run is visibly red."
          exit 1
