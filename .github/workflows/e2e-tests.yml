name: E2E Tests

on:
  workflow_dispatch:  # Manual triggering only

permissions:
  contents: read
  checks: write

jobs:
  e2e-tests:
    runs-on: self-hosted  # Use self-hosted runner on your local machine

    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Start Docker services
        run: docker-compose -f infrastructure/docker/docker-compose.yml up -d
        timeout-minutes: 5

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to start..."
          sleep 30
          docker-compose -f infrastructure/docker/docker-compose.yml ps
        timeout-minutes: 2

      - name: Seed test data
        run: |
          echo "Seeding E2E test data..."
          cat infrastructure/postgres/seed-e2e.sql | docker exec -i karmyq-postgres psql -U karmyq_user -d karmyq_db
          echo "Seeding Social Karma v2 test data..."
          cat tests/e2e/seed-social-karma-v2-simple.sql | docker exec -i karmyq-postgres psql -U karmyq_user -d karmyq_db
        timeout-minutes: 1

      - name: Run E2E tests
        run: |
          cd tests/e2e
          npm install
          npx playwright install --with-deps chromium
          npm test -- --project=chromium --workers=1 --reporter=list tests/01-auth.spec.ts tests/02-communities.spec.ts tests/03-requests.spec.ts tests/10-social-karma-v2.spec.ts
        timeout-minutes: 10
        env:
          CI: true
          FEED_API_URL: http://localhost:3007
          AUTH_API_URL: http://localhost:3001
          COMMUNITY_API_URL: http://localhost:3002

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: tests/e2e/test-results/
          retention-days: 7

      - name: Cleanup Docker services
        if: always()
        run: docker-compose -f infrastructure/docker/docker-compose.yml down
        timeout-minutes: 2
