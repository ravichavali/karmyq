name: E2E Tests

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:  # Allow manual triggering

jobs:
  e2e-tests:
    runs-on: self-hosted  # Use self-hosted runner on your local machine

    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Start Docker services
        run: docker-compose -f infrastructure/docker/docker-compose.yml up -d
        timeout-minutes: 5

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for services to start..."
          sleep 30
          docker-compose -f infrastructure/docker/docker-compose.yml ps
        timeout-minutes: 2

      - name: Run E2E tests
        run: |
          cd tests/e2e
          npm install
          npx playwright install --with-deps chromium
          npm test -- --project=chromium --workers=1 --reporter=list
        timeout-minutes: 15
        env:
          CI: true

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          retention-days: 7

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: tests/e2e/test-results/
          retention-days: 7

      - name: Cleanup Docker services
        if: always()
        run: docker-compose -f infrastructure/docker/docker-compose.yml down
        timeout-minutes: 2
