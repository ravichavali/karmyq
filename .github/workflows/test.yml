name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test-auth-service:
    name: Test Auth Service
    runs-on: ubuntu-latest  # Service containers require Linux runner

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Run linter
        working-directory: services/auth-service
        run: npm run lint || echo "Linter not configured yet"

      - name: Run unit + regression tests
        working-directory: services/auth-service
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret

      - name: Run integration tests
        working-directory: services/auth-service
        run: npm run test:integration || echo "No integration tests configured"
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret

  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build shared package
        run: npm run build --workspace=packages/shared

      - name: Run linter
        run: npm run lint --workspace=apps/frontend || echo "Linter warnings (non-blocking)"

      - name: Build
        run: npm run build --workspace=apps/frontend

  docker-build:
    name: Test Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker images
        run: docker compose -f infrastructure/docker/docker-compose.yml build

      - name: Start services
        run: docker compose -f infrastructure/docker/docker-compose.yml up -d

      - name: Wait for services
        run: sleep 30

      - name: Check service health
        run: |
          curl -f http://localhost:3001/health || exit 1
          curl -f http://localhost:3000 || exit 1

      - name: Show logs on failure
        if: failure()
        run: docker compose -f infrastructure/docker/docker-compose.yml logs

      - name: Stop services
        if: always()
        run: docker compose -f infrastructure/docker/docker-compose.yml down
