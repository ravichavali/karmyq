name: karmyq

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: karmyq-postgres
    environment:
      POSTGRES_USER: karmyq_user
      POSTGRES_PASSWORD: karmyq_password_dev
      POSTGRES_DB: karmyq_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U karmyq_user -d karmyq_db" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - karmyq-network

  # Redis for events and caching
  redis:
    image: redis:7-alpine
    container_name: karmyq-redis
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - karmyq-network

  # Redis Commander (for debugging)
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: karmyq-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      - redis
    networks:
      - karmyq-network

  # Docker Registry (for self-hosted image storage)
  registry:
    image: registry:2
    container_name: karmyq-registry
    environment:
      REGISTRY_STORAGE_FILESYSTEM_ROOTDIRECTORY: /var/lib/registry
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - registry_data:/var/lib/registry
      - ../../infrastructure/docker/registry/config.yml:/etc/docker/registry/config.yml:ro
      - ../../infrastructure/docker/registry/htpasswd:/auth/htpasswd:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5000/v2/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - karmyq-network

  # Auth Service
  auth-service:
    build:
      context: ../../services/auth-service
      dockerfile: Dockerfile
    container_name: karmyq-auth-service
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://karmyq_user:karmyq_password_dev@postgres:5432/karmyq_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production
      RATE_LIMIT_DISABLED: true
    ports:
      - "127.0.0.1:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../services/auth-service/src:/app/src
      - ../../packages/shared:/app/shared
    networks:
      - karmyq-network
    command: npm run dev

  # Community Service
  community-service:
    build:
      context: ../../services/community-service
      dockerfile: Dockerfile
    container_name: karmyq-community-service
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://karmyq_user:karmyq_password_dev@postgres:5432/karmyq_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production
      RATE_LIMIT_DISABLED: true
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../services/community-service/src:/app/src
      - ../../packages/shared:/app/shared
    networks:
      - karmyq-network
    command: npm run dev

  # Request Service
  request-service:
    build:
      context: ../../services/request-service
      dockerfile: Dockerfile
    container_name: karmyq-request-service
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: postgresql://karmyq_user:karmyq_password_dev@postgres:5432/karmyq_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production
      RATE_LIMIT_DISABLED: true
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../services/request-service/src:/app/src
      - ../../packages/shared:/app/shared
    networks:
      - karmyq-network
    command: npm run dev

  # Reputation Service
  reputation-service:
    build:
      context: ../../services/reputation-service
      dockerfile: Dockerfile
    container_name: karmyq-reputation-service
    environment:
      NODE_ENV: development
      PORT: 3004
      DATABASE_URL: postgresql://karmyq_user:karmyq_password_dev@postgres:5432/karmyq_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production
      RATE_LIMIT_DISABLED: true
    ports:
      - "127.0.0.1:3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../services/reputation-service/src:/app/src
      - ../../packages/shared:/app/shared
    networks:
      - karmyq-network
    command: npm run dev

  # Notification Service
  notification-service:
    build:
      context: ../../services/notification-service
      dockerfile: Dockerfile
    container_name: karmyq-notification-service
    environment:
      NODE_ENV: development
      PORT: 3005
      DATABASE_URL: postgresql://karmyq_user:karmyq_password_dev@postgres:5432/karmyq_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production
      RATE_LIMIT_DISABLED: true
    ports:
      - "127.0.0.1:3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../services/notification-service/src:/app/src
      - ../../packages/shared:/app/shared
    networks:
      - karmyq-network
    command: npm run dev

  # Messaging Service
  messaging-service:
    build:
      context: ../../services/messaging-service
      dockerfile: Dockerfile
    container_name: karmyq-messaging-service
    environment:
      NODE_ENV: development
      PORT: 3006
      DATABASE_URL: postgresql://karmyq_user:karmyq_password_dev@postgres:5432/karmyq_db
      JWT_SECRET: dev_jwt_secret_change_in_production
      RATE_LIMIT_DISABLED: true
    ports:
      - "127.0.0.1:3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../services/messaging-service/src:/app/src
      - ../../packages/shared:/app/shared
    networks:
      - karmyq-network
    command: npm run dev

  # Feed Service
  feed-service:
    build:
      context: ../../services/feed-service
      dockerfile: Dockerfile
    container_name: karmyq-feed-service
    environment:
      NODE_ENV: development
      PORT: 3007
      DATABASE_URL: postgresql://karmyq_user:karmyq_password_dev@postgres:5432/karmyq_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production
      RATE_LIMIT_DISABLED: true
      COMMUNITY_API_URL: http://community-service:3002
      REQUEST_API_URL: http://request-service:3003
      REPUTATION_API_URL: http://reputation-service:3004
      AUTH_API_URL: http://auth-service:3001
    ports:
      - "127.0.0.1:3007:3007"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ../../services/feed-service/src:/app/src
      - ../../packages/shared:/app/shared
    networks:
      - karmyq-network
    command: npm run dev

  # Cleanup Service
  cleanup-service:
    build:
      context: ../../services/cleanup-service
      dockerfile: Dockerfile
    container_name: karmyq-cleanup-service
    environment:
      NODE_ENV: development
      PORT: 3008
      DATABASE_URL: postgresql://karmyq_user:karmyq_password_dev@postgres:5432/karmyq_db
      JWT_SECRET: dev_jwt_secret_change_in_production
      RATE_LIMIT_DISABLED: true
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:3008:3008"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../services/cleanup-service/src:/app/src
    networks:
      - karmyq-network
    command: npm run dev

  # Geocoding Cache Service (Port 3009)
  geocoding-service:
    build:
      context: ../../services/geocoding-service
      dockerfile: Dockerfile
    container_name: karmyq-geocoding-service
    environment:
      NODE_ENV: development
      PORT: 3009
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: karmyq_db
      DB_USER: karmyq_user
      DB_PASSWORD: karmyq_password_dev
    ports:
      - "127.0.0.1:3009:3009"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../services/geocoding-service:/app
      - /app/node_modules
    networks:
      - karmyq-network

  # Social Graph Service (Port 3010)
  social-graph-service:
    build:
      context: ../..
      dockerfile: services/social-graph-service/Dockerfile
    container_name: karmyq-social-graph-service
    environment:
      NODE_ENV: development
      PORT: 3010
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: karmyq_db
      DB_USER: karmyq_user
      DB_PASSWORD: karmyq_password_dev
      JWT_SECRET: dev_jwt_secret_change_in_production
      FRONTEND_URL: http://localhost:3000
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:3010:3010"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../../services/social-graph-service/src:/app/src
      - ../../packages/shared:/app/shared
    networks:
      - karmyq-network
    command: npm run dev

  # Frontend
  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
    container_name: karmyq-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_COMMUNITY_API_URL: http://localhost:3002
      NEXT_PUBLIC_REQUEST_API_URL: http://localhost:3003
      NEXT_PUBLIC_REPUTATION_API_URL: http://localhost:3004
      NEXT_PUBLIC_NOTIFICATION_API_URL: http://localhost:3005
      NEXT_PUBLIC_MESSAGING_API_URL: http://localhost:3006
      NEXT_PUBLIC_FEED_API_URL: http://localhost:3007
      NEXT_PUBLIC_SOCIAL_GRAPH_API_URL: http://localhost:3010
      NODE_ENV: development
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ../../apps/frontend/src:/app/src
      - ../../apps/frontend/public:/app/public
    networks:
      - karmyq-network
    # command removed - using CMD from Dockerfile (npm start for production build)

    # ============= OBSERVABILITY STACK =============

    # Grafana Loki - Log aggregation
  loki:
    image: grafana/loki:3.3.2
    container_name: karmyq-loki
    ports:
      - "127.0.0.1:3100:3100"
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../../infrastructure/observability/loki/loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    networks:
      - karmyq-network

  # Promtail - Log shipper (collects from Docker containers)
  promtail:
    image: grafana/promtail:3.3.2
    container_name: karmyq-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../infrastructure/observability/loki/promtail-config.yml:/etc/promtail/config.yml
      - ../../services/auth-service/logs:/var/log/services/auth-service:ro
      - ../../services/community-service/logs:/var/log/services/community-service:ro
      - ../../services/request-service/logs:/var/log/services/request-service:ro
      - ../../services/matching-service/logs:/var/log/services/matching-service:ro
      - ../../services/reputation-service/logs:/var/log/services/reputation-service:ro
      - ../../services/notification-service/logs:/var/log/services/notification-service:ro
      - ../../services/messaging-service/logs:/var/log/services/messaging-service:ro
      - ../../services/feed-service/logs:/var/log/services/feed-service:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - karmyq-network

  # Grafana - Visualization
  grafana:
    image: grafana/grafana:10.2.0
    container_name: karmyq-grafana
    ports:
      - "127.0.0.1:3011:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ../../infrastructure/observability/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - loki
    networks:
      - karmyq-network

  # Prometheus - Metrics (optional but recommended)
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: karmyq-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ../../infrastructure/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - karmyq-network

volumes:
  postgres_data:
  redis_data:
  registry_data:
  loki-data:
  grafana-data:
  prometheus-data:


networks:
  karmyq-network:
    driver: bridge
