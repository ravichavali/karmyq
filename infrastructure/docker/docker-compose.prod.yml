# Production overrides for docker-compose.yml
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Key differences from development:
# - volumes: [] removes source code mounts (uses built image)
# - command: [] uses Dockerfile CMD instead of npm run dev
# - Environment variables come from .env.production file

services:
  # Auth Service
  auth-service:
    restart: always
    volumes: ~
    command: []
    environment:
      NODE_ENV: production
      PORT: 3001
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-false}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # Community Service
  community-service:
    restart: always
    volumes: ~
    command: []
    environment:
      NODE_ENV: production
      PORT: 3002
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-false}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # Request Service
  request-service:
    restart: always
    volumes: ~
    command: []
    environment:
      NODE_ENV: production
      PORT: 3003
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-false}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # Reputation Service
  reputation-service:
    restart: always
    volumes: ~
    command: []
    environment:
      NODE_ENV: production
      PORT: 3004
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-false}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # Notification Service
  notification-service:
    restart: always
    volumes: ~
    command: []
    environment:
      NODE_ENV: production
      PORT: 3005
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-false}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # Messaging Service
  messaging-service:
    restart: always
    volumes: ~
    command: []
    environment:
      NODE_ENV: production
      PORT: 3006
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-false}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # Feed Service
  feed-service:
    restart: always
    volumes: ~
    command: []
    environment:
      NODE_ENV: production
      PORT: 3007
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-false}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # Cleanup Service
  cleanup-service:
    restart: always
    volumes: ~
    command: []
    environment:
      NODE_ENV: production
      PORT: 3008
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-false}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # Geocoding Service
  geocoding-service:
    restart: always
    volumes: []
    command: []
    environment:
      NODE_ENV: production
      PORT: 3009
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  # Social Graph Service
  social-graph-service:
    restart: always
    volumes: ~
    command: []
    environment:
      NODE_ENV: production
      PORT: 3010
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M

  # Frontend
  frontend:
    restart: always
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_COMMUNITY_API_URL: ${NEXT_PUBLIC_COMMUNITY_API_URL:-/api}
        NEXT_PUBLIC_REQUEST_API_URL: ${NEXT_PUBLIC_REQUEST_API_URL:-/api}
        NEXT_PUBLIC_REPUTATION_API_URL: ${NEXT_PUBLIC_REPUTATION_API_URL:-/api}
        NEXT_PUBLIC_NOTIFICATION_API_URL: ${NEXT_PUBLIC_NOTIFICATION_API_URL:-/api}
        NEXT_PUBLIC_MESSAGING_API_URL: ${NEXT_PUBLIC_MESSAGING_API_URL:-/api}
        NEXT_PUBLIC_FEED_API_URL: ${NEXT_PUBLIC_FEED_API_URL:-/api}
        NEXT_PUBLIC_SOCIAL_GRAPH_API_URL: ${NEXT_PUBLIC_SOCIAL_GRAPH_API_URL:-/api}
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

  # Database
  postgres:
    restart: always
    volumes:
      - postgres_backup:/var/backup
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-karmyq_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-karmyq_production}

  # Redis
  redis:
    restart: always
    command: redis-server --save 60 1 --loglevel warning

  # Disable Redis Commander in Production
  redis-commander:
    deploy:
      replicas: 0

  # Disable registry in Production (not needed for build-on-server)
  registry:
    deploy:
      replicas: 0

  # Observability - Reduced retention for production
  loki:
    restart: always
    command:
      - -config.file=/etc/loki/local-config.yaml

  prometheus:
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'

volumes:
  postgres_backup:
