services:
  # Auth Service
  auth-service:
    restart: always
    environment:
      NODE_ENV: production
      RATE_LIMIT_DISABLED: false
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
        reservations:
          cpus: '0.10'
          memory: 128M
    ports:
      - "127.0.0.1:3001:3001"

  # Community Service
  community-service:
    restart: always
    environment:
      NODE_ENV: production
      RATE_LIMIT_DISABLED: false
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    ports:
      - "127.0.0.1:3002:3002"

  # Request Service
  request-service:
    restart: always
    environment:
      NODE_ENV: production
      RATE_LIMIT_DISABLED: false
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    ports:
      - "127.0.0.1:3003:3003"

  # Reputation Service
  reputation-service:
    restart: always
    environment:
      NODE_ENV: production
      RATE_LIMIT_DISABLED: false
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      JWT_SECRET: ${JWT_SECRET}
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    ports:
      - "127.0.0.1:3004:3004"

  # Notification Service
  notification-service:
    restart: always
    environment:
      NODE_ENV: production
      RATE_LIMIT_DISABLED: false
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    ports:
      - "127.0.0.1:3005:3005"

  # Messaging Service
  messaging-service:
    restart: always
    environment:
      NODE_ENV: production
      RATE_LIMIT_DISABLED: false
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    ports:
      - "127.0.0.1:3006:3006"

  # Feed Service
  feed-service:
    restart: always
    environment:
      NODE_ENV: production
      RATE_LIMIT_DISABLED: false
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    ports:
      - "127.0.0.1:3007:3007"

  # Cleanup Service
  cleanup-service:
    restart: always
    environment:
      NODE_ENV: production
      RATE_LIMIT_DISABLED: false
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    # No ports exposed for cleanup service

    # Geocoding Service
  geocoding-service:
    restart: always
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M
    ports:
      - "127.0.0.1:3009:3009"

  # Social Graph Service
  social-graph-service:
    restart: always
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          cpus: '0.50'
          memory: 512M
    ports:
      - "127.0.0.1:3010:3010"

  # Frontend
  frontend:
    build:
      context: ../../apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_COMMUNITY_API_URL: ${NEXT_PUBLIC_COMMUNITY_API_URL}
        NEXT_PUBLIC_REQUEST_API_URL: ${NEXT_PUBLIC_REQUEST_API_URL}
        NEXT_PUBLIC_REPUTATION_API_URL: ${NEXT_PUBLIC_REPUTATION_API_URL}
        NEXT_PUBLIC_NOTIFICATION_API_URL: ${NEXT_PUBLIC_NOTIFICATION_API_URL}
        NEXT_PUBLIC_MESSAGING_API_URL: ${NEXT_PUBLIC_MESSAGING_API_URL}
        NEXT_PUBLIC_FEED_API_URL: ${NEXT_PUBLIC_FEED_API_URL}
        NEXT_PUBLIC_SOCIAL_GRAPH_API_URL: ${NEXT_PUBLIC_SOCIAL_GRAPH_API_URL}
    restart: always
    environment:
      NODE_ENV: production
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    ports:
      - "127.0.0.1:3000:3000"

  # Database
  postgres:
    restart: always
    volumes:
      - postgres_backup:/var/backup
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

  # Redis
  redis:
    restart: always
    command: redis-server --save 60 1 --loglevel warning
    ports:
      - "127.0.0.1:6379:6379"

  # Disable Redis Commander in Production (Save resources + Avoid ARM64 warning)
  redis-commander:
    deploy:
      replicas: 0

  # Observability - Reduced retention for production to save disk
  loki:
    restart: always
    command: -config.file=/etc/loki/local-config.yaml -retention.period=168h # 7 days
    ports:
      - "127.0.0.1:3100:3100"

  prometheus:
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "127.0.0.1:9090:9090"

volumes:
  postgres_backup:
