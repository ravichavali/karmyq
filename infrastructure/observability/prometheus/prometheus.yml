global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Simulation service metrics (port 9099)
  # Simulation runs as a pm2 process on the host (not in Docker).
  # host-gateway resolves to the host via Docker's extra_hosts mapping.
  - job_name: 'simulation'
    static_configs:
      - targets: ['host-gateway:9099']

  # Add service metrics endpoints here as they are instrumented
  # - job_name: 'auth-service'
  #   static_configs:
  #     - targets: ['auth-service:3001']
