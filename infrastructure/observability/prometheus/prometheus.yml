global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Simulation service metrics (port 9099)
  # Simulation runs as a pm2 process on the host (not in Docker).
  # host-gateway resolves to the host via Docker's extra_hosts mapping.
  - job_name: 'simulation'
    static_configs:
      - targets: ['host-gateway:9099']

  # Docker container metrics (CPU, memory, network, disk I/O per container)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metric_relabel_configs:
      # Drop high-cardinality metrics we don't need
      - source_labels: [__name__]
        regex: 'container_(tasks_state|memory_failures_total)'
        action: drop

  # Host-level metrics (CPU, memory, disk, network)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
