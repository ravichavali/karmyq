# infrastructure/nginx/nginx.conf

# Upstream definitions for Karmyq Microservices
# Assumes services are running on localhost ports (mapped via Docker Compose)

# Auth Service
upstream auth_service {
    server 127.0.0.1:3001;
}

# Community Service
upstream community_service {
    server 127.0.0.1:3002;
}

# Request Service
upstream request_service {
    server 127.0.0.1:3003;
}

# Reputation Service
upstream reputation_service {
    server 127.0.0.1:3004;
}

# Notification Service - NEEDS STICKY SESSIONS (SSE)
upstream notification_service {
    ip_hash; # Sticky session based on client IP
    server 127.0.0.1:3005;
}

# Messaging Service - NEEDS STICKY SESSIONS (WebSocket)
upstream messaging_service {
    ip_hash; # Sticky session based on client IP
    server 127.0.0.1:3006;
}

# Feed Service
upstream feed_service {
    server 127.0.0.1:3007;
}

# Geocoding Service
upstream geocoding_service {
    server 127.0.0.1:3009;
}

# Social Graph Service
upstream social_graph_service {
    server 127.0.0.1:3010;
}

# Frontend (Next.js)
upstream frontend {
    server 127.0.0.1:3000;
}

# Grafana
upstream grafana {
    server 127.0.0.1:3011;
}

server {
    listen 80;
    server_name karmyq.com www.karmyq.com;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Allow Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 443 ssl;
    server_name karmyq.com www.karmyq.com;

    # SSL Configuration (using placeholder until Certbot runs)
    # user will uncomment these after running certbot
    # ssl_certificate /etc/letsencrypt/live/karmyq.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/karmyq.com/privkey.pem;
    
    # Check ssl.conf for detailed SSL hardening settings
    include /etc/nginx/conf.d/ssl.conf;

    # ==================== API ROUTING ====================

    # Auth API
    location /api/auth {
        proxy_pass http://auth_service;
        include /etc/nginx/proxy_params;
    }

    # Community API
    location /api/communities {
        proxy_pass http://community_service;
        include /etc/nginx/proxy_params;
    }

    # Request API
    location /api/requests {
        proxy_pass http://request_service;
        include /etc/nginx/proxy_params;
    }

    # Reputation API
    location /api/reputation {
        proxy_pass http://reputation_service;
        include /etc/nginx/proxy_params;
    }

    # Notification API (SSE)
    location /api/notifications {
        proxy_pass http://notification_service;
        include /etc/nginx/proxy_params;
        
        # SSE specific headers
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    # Messaging API (WebSocket)
    location /socket.io/ {
        proxy_pass http://messaging_service;
        include /etc/nginx/proxy_params;

        # WebSocket headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /api/messages {
        proxy_pass http://messaging_service;
        include /etc/nginx/proxy_params;
    }

    # Feed API
    location /api/feed {
        proxy_pass http://feed_service;
        include /etc/nginx/proxy_params;
    }

    # Geocoding API
    location /api/geocoding {
        proxy_pass http://geocoding_service;
        include /etc/nginx/proxy_params;
    }

    # Social Graph API
    location /api/social-graph {
        proxy_pass http://social_graph_service;
        include /etc/nginx/proxy_params;
    }
    
    # Internal Ops (Grafana) - password protected ideally, but simple proxy for now
    location /monitor/ {
        proxy_pass http://grafana/;
        include /etc/nginx/proxy_params;
        rewrite  ^/monitor/(.*)  /$1 break;
    }

    # ==================== FRONTEND ====================

    location / {
        proxy_pass http://frontend;
        include /etc/nginx/proxy_params;
    }
}
