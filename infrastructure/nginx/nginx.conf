# infrastructure/nginx/nginx.conf

# Upstream definitions for Karmyq Microservices
# Assumes services are running on localhost ports (mapped via Docker Compose)

# Auth Service
upstream auth_service {
    server 127.0.0.1:3001;
}

# Community Service
upstream community_service {
    server 127.0.0.1:3002;
}

# Request Service
upstream request_service {
    server 127.0.0.1:3003;
}

# Reputation Service
upstream reputation_service {
    server 127.0.0.1:3004;
}

# Notification Service - NEEDS STICKY SESSIONS (SSE)
upstream notification_service {
    ip_hash; # Sticky session based on client IP
    server 127.0.0.1:3005;
}

# Messaging Service - NEEDS STICKY SESSIONS (WebSocket)
upstream messaging_service {
    ip_hash; # Sticky session based on client IP
    server 127.0.0.1:3006;
}

# Geocoding Service
upstream geocoding_service {
    server 127.0.0.1:3009;
}

# Social Graph Service
upstream social_graph_service {
    server 127.0.0.1:3010;
}

# Frontend (Next.js)
upstream frontend {
    server 127.0.0.1:3000;
}

# Grafana
upstream grafana {
    server 127.0.0.1:3011;
}

# ==================== SSE JWT LOG SCRUB (ADR-064) ====================
# Browser EventSource can't set headers, so /api/notifications/stream accepts the
# JWT as an `access_token` query arg (Sprint 81). That token would otherwise land
# in nginx access logs in cleartext. The map below rewrites the `access_token`
# value to `***` in a sanitized request line, which the notification location's
# access_log uses instead of $request. Maps must live at http{} scope (this file
# is included within http{}); the access_log/log_format below is location-scoped.
#
# Token TTL decision (ADR-064): access tokens are retained at 1h with rotation —
# the balance of stream UX vs. blast radius. Not shortened here (shorter TTL needs
# a refresh-on-SSE story first). This scrub removes the cleartext-in-logs exposure.
map $request $karmyq_sanitized_request {
    default                          $request;
    "~^(?<pre>.*[?&]access_token=)[^&\s]*(?<post>.*)$"  "${pre}***${post}";
}

log_format karmyq_sse_scrubbed '$remote_addr - $remote_user [$time_local] '
                               '"$karmyq_sanitized_request" $status $body_bytes_sent '
                               '"$http_referer" "$http_user_agent"';

# ==================== HTTP → HTTPS REDIRECTS ====================

server {
    listen 80;
    server_name karmyq.com www.karmyq.com karmyq-staging karmyq-staging.local;

    # Redirect all HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }

    # Allow Let's Encrypt validation
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

server {
    listen 80;
    server_name karmyq.org www.karmyq.org;

    location / {
        return 301 https://$host$request_uri;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# ==================== KARMYQ.ORG (Landing Page - Static) ====================

server {
    listen 443 ssl;
    server_name karmyq.org www.karmyq.org;

    include /etc/nginx/snippets/ssl-certificates-org.conf;
    include /etc/nginx/snippets/ssl-hardening.conf;

    root /var/www/karmyq-landing;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets aggressively
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(svg|ico|css|js|jpg|jpeg|png|gif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name karmyq.com www.karmyq.com;

    # SSL Configuration
    # We use a dynamic include so we can swap between Self-Signed (Staging) and Let's Encrypt (Prod)
    include /etc/nginx/snippets/ssl-certificates.conf;
    
    # Check ssl.conf for detailed SSL hardening settings
    include /etc/nginx/snippets/ssl-hardening.conf;

    # ==================== API ROUTING ====================

    # Auth API
    location ~ ^/api/auth(/.*)?$ {
        proxy_pass http://auth_service/auth$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Users API (auth service handles user endpoints)
    location ~ ^/api/users(/.*)?$ {
        proxy_pass http://auth_service/users$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Founding-circle intake (public, auth service — Sprint 96, ADR-076)
    location ~ ^/api/founding-circle(/.*)?$ {
        proxy_pass http://auth_service/founding-circle$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Community API
    location ~ ^/api/communities(/.*)?$ {
        proxy_pass http://community_service/communities$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Request API
    location ~ ^/api/requests(/.*)?$ {
        proxy_pass http://request_service/requests$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Request API - Matches (also handled by request service)
    location ~ ^/api/matches(/.*)?$ {
        proxy_pass http://request_service/matches$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Request API - Offers (also handled by request service)
    location ~ ^/api/offers(/.*)?$ {
        proxy_pass http://request_service/offers$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Request API - Schemas (UI Schema Manager, Server-Driven UI)
    location ~ ^/api/schemas(/.*)?$ {
        proxy_pass http://request_service/schemas$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Request API - Admin Schemas
    location ~ ^/api/admin/schemas(/.*)?$ {
        proxy_pass http://request_service/admin/schemas$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Request API - Provider directory
    location ~ ^/api/providers(/.*)?$ {
        proxy_pass http://request_service/providers$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Request API - Provider collectives
    location ~ ^/api/collectives(/.*)?$ {
        proxy_pass http://request_service/collectives$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Reputation API
    location ~ ^/api/reputation(/.*)?$ {
        proxy_pass http://reputation_service/reputation$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Notification API (SSE)
    location ~ ^/api/notifications(/.*)?$ {
        # ADR-064: log with the access_token query value masked (see http-scope map).
        access_log /var/log/nginx/access.log karmyq_sse_scrubbed;

        proxy_pass http://notification_service/notifications$1$is_args$args;
        include /etc/nginx/proxy_params;

        # SSE specific headers
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        proxy_buffering off;
        proxy_cache off;
    }

    # Messaging API (WebSocket)
    location /socket.io/ {
        proxy_pass http://messaging_service;
        include /etc/nginx/proxy_params;

        # WebSocket headers
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location ~ ^/api/messages(/.*)?$ {
        proxy_pass http://messaging_service/messages$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Messaging API - Conversations
    location ~ ^/api/conversations(/.*)?$ {
        proxy_pass http://messaging_service/conversations$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Messaging API - Match-based messaging
    location ~ ^/api/match(/.*)?$ {
        proxy_pass http://messaging_service/match$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Geocoding API
    location ~ ^/api/geocoding(/.*)?$ {
        proxy_pass http://geocoding_service$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Social Graph internal routes are service-network-only; never proxy them from the public edge.
    location ^~ /api/social-graph/internal/ {
        return 404;
    }

    # Social Graph API
    location ~ ^/api/social-graph(/.*)?$ {
        proxy_pass http://social_graph_service/social-graph$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Social Graph API - Invitations (shortcut)
    location ~ ^/api/invitations(/.*)?$ {
        proxy_pass http://social_graph_service/invitations$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Social Graph API - Trust Paths (shortcut)
    location ~ ^/api/paths(/.*)?$ {
        proxy_pass http://social_graph_service/paths$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Social Graph API - Network graph (Sprint 27)
    location ~ ^/api/network(/.*)?$ {
        proxy_pass http://social_graph_service/network$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Social Graph API - Trust Card
    location ~ ^/api/trust-card(/.*)?$ {
        proxy_pass http://social_graph_service/trust-card$1$is_args$args;
        include /etc/nginx/proxy_params;
    }

    # Social Graph API - Trust Graph + Trust Edge (Sprint 65/66)
    location ~ ^/api/trust(/.*)?$ {
        proxy_pass http://social_graph_service/trust$1$is_args$args;
        include /etc/nginx/proxy_params;
    }
    
    # Grafana dashboards (login required, Grafana handles /grafana/ sub-path internally)
    location /grafana/ {
        proxy_pass http://grafana;
        include /etc/nginx/proxy_params;
    }

    # ==================== FRONTEND ====================

    location / {
        proxy_pass http://frontend;
        include /etc/nginx/proxy_params;
    }
}
