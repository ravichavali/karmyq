# Nginx configuration for karmyq.com
# Place this in /etc/nginx/sites-available/karmyq.com
# Then: sudo ln -s /etc/nginx/sites-available/karmyq.com /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

# Upstream definitions for backend services
upstream frontend {
    server 127.0.0.1:3000;
}

upstream auth_service {
    server 127.0.0.1:3001;
}

upstream community_service {
    server 127.0.0.1:3002;
}

upstream request_service {
    server 127.0.0.1:3003;
}

upstream reputation_service {
    server 127.0.0.1:3004;
}

upstream notification_service {
    server 127.0.0.1:3005;
}

upstream messaging_service {
    server 127.0.0.1:3006;
}

upstream cleanup_service {
    server 127.0.0.1:3008;
}

upstream geocoding_service {
    server 127.0.0.1:3009;
}

upstream social_graph_service {
    server 127.0.0.1:3010;
}

# HTTP server - redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name karmyq.com www.karmyq.com;

    # Allow Let's Encrypt challenges
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    # Redirect all other traffic to HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name karmyq.com www.karmyq.com;

    # SSL configuration
    ssl_certificate /etc/letsencrypt/live/karmyq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karmyq.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Logging
    access_log /var/log/nginx/karmyq-access.log;
    error_log /var/log/nginx/karmyq-error.log;

    # Increase client body size for file uploads
    client_max_body_size 10M;

    # API Routes - Proxy to backend services
    # NOTE: Backend services expect /auth/, /communities/, /requests/, etc. (NOT /api/xxx/)
    # Frontend sends: /api/communities/123
    # Nginx should proxy to: community_service/communities/123
    # Using rewrite to strip /api prefix only:
    # rewrite ^/api/(.*)$ /$1 break; would turn /api/communities/123 → /communities/123

    # Auth Service - Strip /api prefix only
    location /api/auth/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://auth_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Community Service - Strip /api prefix only
    location /api/communities/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://community_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Request Service - Strip /api prefix only
    location /api/requests/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://request_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Reputation Service - Strip /api prefix only
    location /api/reputation/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://reputation_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Notification Service (includes SSE endpoints) - Strip /api prefix only
    location /api/notifications/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://notification_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # SSE-specific settings
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding on;
        proxy_read_timeout 3600s;
    }

    # Messaging Service - Strip /api prefix only
    location /api/messaging/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://messaging_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Conversations endpoint - Routes to Messaging Service
    # Frontend calls /api/conversations → messaging_service/conversations
    location /api/conversations {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://messaging_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Matches endpoint - Routes to Request Service
    # Frontend calls /api/matches → request_service/matches
    location /api/matches {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://request_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Socket.IO - WebSocket connection for real-time messaging
    # Frontend connects to wss://karmyq.com/socket.io/
    location /socket.io/ {
        proxy_pass http://messaging_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_buffering off;
        proxy_read_timeout 86400s;  # 24 hours for WebSocket
        proxy_send_timeout 86400s;
    }

    # Geocoding Service - Strip /api prefix only
    location /api/geocoding/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://geocoding_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Social Graph internal routes are service-network-only; never proxy them from the public edge.
    location ^~ /api/social/internal/ {
        return 404;
    }

    # Social Graph Service - Strip /api prefix only
    location /api/social/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://social_graph_service;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Docker Registry - For image storage and distribution
    location /v2/ {
        # Disable request size limit for image uploads
        client_max_body_size 0;

        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for large image uploads
        proxy_connect_timeout 900;
        proxy_send_timeout 900;
        proxy_read_timeout 900;
        send_timeout 900;

        # Required for chunked uploads
        proxy_request_buffering off;

        # Add CORS headers for registry API
        add_header 'Docker-Distribution-Api-Version' 'registry/2.0' always;
    }

    # Health check endpoints (useful for monitoring)
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    # Frontend - Proxy to Next.js (should be last to catch all other routes)
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Static files caching
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
