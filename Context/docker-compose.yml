version: '3.9'

services:
  # ============================================
  # INFRASTRUCTURE SERVICES
  # ============================================
  
  postgres:
    image: postgres:15-alpine
    container_name: karmyq-postgres
    environment:
      POSTGRES_USER: karmyq_user
      POSTGRES_PASSWORD: karmyq_password_dev
      POSTGRES_DB: karmyq_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karmyq_user -d karmyq_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - karmyq-network

  redis:
    image: redis:7-alpine
    container_name: karmyq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - karmyq-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: karmyq-redis-commander
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - karmyq-network

  # ============================================
  # API GATEWAY / REVERSE PROXY
  # ============================================
  
  nginx:
    image: nginx:alpine
    container_name: karmyq-api-gateway
    ports:
      - "3000:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/api-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - auth-service
      - community-service
      - request-service
      - reputation-service
      - messaging-service
      - notification-service
      - governance-service
    networks:
      - karmyq-network

  # ============================================
  # MICROSERVICES
  # ============================================
  
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: karmyq-auth-service
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://karmyq_user:karmyq_password_dev@postgres:5432/karmyq_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: dev_jwt_secret_change_in_production
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/auth-service/src:/app/src
    networks:
      - karmyq-network
    command: npm run dev

  community-service:
    build:
      context: ./services/community-service
      dockerfile: Dockerfile
    container_name: karmyq-community-service
    environment:
      NODE_ENV: development
      PORT: 3002
      DATABASE_URL: postgresql://karmyq_user:karmyq_password_dev@postgres:5432/karmyq_db
      REDIS_URL: redis://redis:6379
      BULL_QUEUE_URL: redis://redis:6379
    ports:
      - "3002:3002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/community-service/src:/app/src
    networks:
      - karmyq-network
    command: npm run dev

  request-service:
    build:
      context: ./services/request-service
      dockerfile: Dockerfile
    container_name: karmyq-request-service
    environment:
      NODE_ENV: development
      PORT: 3003
      DATABASE_URL: postgresql://karmyq_user:karmyq_password_dev@postgres:5432/karmyq_db
      REDIS_URL: redis://redis:6379
      BULL_QUEUE_URL: redis://redis:6379
    ports:
      - "3003:3003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/request-service/src:/app/src
    networks:
      - karmyq-network
    command: npm run dev

  reputation-service:
    build:
      context: ./services/reputation-service
      dockerfile: Dockerfile
    container_name: karmyq-reputation-service
    environment:
      NODE_ENV: development
      PORT: 3004
      DATABASE_URL: postgresql://karmyq_user:karmyq_password_dev@postgres:5432/karmyq_db
      REDIS_URL: redis://redis:6379
      BULL_QUEUE_URL: redis://redis:6379
    ports:
      - "3004:3004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/reputation-service/src:/app/src
    networks:
      - karmyq-network
    command: npm run dev

  messaging-service:
    build:
      context: ./services/messaging-service
      dockerfile: Dockerfile
    container_name: karmyq-messaging-service
    environment:
      NODE_ENV: development
      PORT: 3005
      DATABASE_URL: postgresql://karmyq_user:karmyq_password_dev@postgres:5432/karmyq_db
      REDIS_URL: redis://redis:6379
      BULL_QUEUE_URL: redis://redis:6379
    ports:
      - "3005:3005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/messaging-service/src:/app/src
    networks:
      - karmyq-network
    command: npm run dev

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: karmyq-notification-service
    environment:
      NODE_ENV: development
      PORT: 3006
      DATABASE_URL: postgresql://karmyq_user:karmyq_password_dev@postgres:5432/karmyq_db
      REDIS_URL: redis://redis:6379
      BULL_QUEUE_URL: redis://redis:6379
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
      SMTP_FROM: noreply@karmyq.local
    ports:
      - "3006:3006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailhog:
        condition: service_started
    volumes:
      - ./services/notification-service/src:/app/src
    networks:
      - karmyq-network
    command: npm run dev

  governance-service:
    build:
      context: ./services/governance-service
      dockerfile: Dockerfile
    container_name: karmyq-governance-service
    environment:
      NODE_ENV: development
      PORT: 3007
      DATABASE_URL: postgresql://karmyq_user:karmyq_password_dev@postgres:5432/karmyq_db
      REDIS_URL: redis://redis:6379
      BULL_QUEUE_URL: redis://redis:6379
    ports:
      - "3007:3007"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/governance-service/src:/app/src
    networks:
      - karmyq-network
    command: npm run dev

  # ============================================
  # FRONTEND
  # ============================================
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: karmyq-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      NODE_ENV: development
    ports:
      - "3100:3000"
    depends_on:
      - nginx
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - karmyq-network
    command: npm run dev

  # ============================================
  # DEVELOPMENT TOOLS
  # ============================================
  
  mailhog:
    image: mailhog/mailhog:latest
    container_name: karmyq-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - karmyq-network

volumes:
  postgres_data:
  redis_data:

networks:
  karmyq-network:
    driver: bridge
