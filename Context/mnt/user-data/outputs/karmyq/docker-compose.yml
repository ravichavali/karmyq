version: '3.8'

services:
  # Core Infrastructure
  postgres:
    image: postgres:15-alpine
    container_name: karmyq-postgres
    environment:
      POSTGRES_USER: karmyq
      POSTGRES_PASSWORD: karmyq_dev_password
      POSTGRES_DB: karmyq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U karmyq"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - karmyq-network

  redis:
    image: redis:7-alpine
    container_name: karmyq-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - karmyq-network

  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: karmyq-redis-commander
    environment:
      - REDIS_HOSTS=local:karmyq-redis:6379
    ports:
      - "8081:8081"
    depends_on:
      - redis
    networks:
      - karmyq-network

  # API Gateway (Nginx)
  api-gateway:
    image: nginx:alpine
    container_name: karmyq-api-gateway
    ports:
      - "3000:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - auth-service
      - community-service
      - request-service
      - reputation-service
      - messaging-service
      - notification-service
      - governance-service
    networks:
      - karmyq-network

  # Microservices
  auth-service:
    build:
      context: ./services/auth-service
      dockerfile: Dockerfile
    container_name: karmyq-auth-service
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: karmyq
      DB_USER: karmyq
      DB_PASSWORD: karmyq_dev_password
      REDIS_URL: redis://karmyq-redis:6379
      JWT_SECRET: dev_secret_change_in_production
      PORT: 4001
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/auth-service/src:/app/src
    networks:
      - karmyq-network
    command: npm run dev

  community-service:
    build:
      context: ./services/community-service
      dockerfile: Dockerfile
    container_name: karmyq-community-service
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: karmyq
      DB_USER: karmyq
      DB_PASSWORD: karmyq_dev_password
      REDIS_URL: redis://karmyq-redis:6379
      PORT: 4002
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/community-service/src:/app/src
    networks:
      - karmyq-network
    command: npm run dev

  request-service:
    build:
      context: ./services/request-service
      dockerfile: Dockerfile
    container_name: karmyq-request-service
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: karmyq
      DB_USER: karmyq
      DB_PASSWORD: karmyq_dev_password
      REDIS_URL: redis://karmyq-redis:6379
      PORT: 4003
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/request-service/src:/app/src
    networks:
      - karmyq-network
    command: npm run dev

  reputation-service:
    build:
      context: ./services/reputation-service
      dockerfile: Dockerfile
    container_name: karmyq-reputation-service
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: karmyq
      DB_USER: karmyq
      DB_PASSWORD: karmyq_dev_password
      REDIS_URL: redis://karmyq-redis:6379
      PORT: 4004
    ports:
      - "4004:4004"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/reputation-service/src:/app/src
    networks:
      - karmyq-network
    command: npm run dev

  messaging-service:
    build:
      context: ./services/messaging-service
      dockerfile: Dockerfile
    container_name: karmyq-messaging-service
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: karmyq
      DB_USER: karmyq
      DB_PASSWORD: karmyq_dev_password
      REDIS_URL: redis://karmyq-redis:6379
      PORT: 4005
    ports:
      - "4005:4005"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/messaging-service/src:/app/src
    networks:
      - karmyq-network
    command: npm run dev

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: karmyq-notification-service
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: karmyq
      DB_USER: karmyq
      DB_PASSWORD: karmyq_dev_password
      REDIS_URL: redis://karmyq-redis:6379
      SMTP_HOST: smtp.example.com
      SMTP_PORT: 587
      SMTP_USER: notifications@karmyq.com
      SMTP_PASSWORD: dev_smtp_password
      PORT: 4006
    ports:
      - "4006:4006"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/notification-service/src:/app/src
    networks:
      - karmyq-network
    command: npm run dev

  governance-service:
    build:
      context: ./services/governance-service
      dockerfile: Dockerfile
    container_name: karmyq-governance-service
    environment:
      NODE_ENV: development
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: karmyq
      DB_USER: karmyq
      DB_PASSWORD: karmyq_dev_password
      REDIS_URL: redis://karmyq-redis:6379
      PORT: 4007
    ports:
      - "4007:4007"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/governance-service/src:/app/src
    networks:
      - karmyq-network
    command: npm run dev

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: karmyq-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      NODE_ENV: development
    ports:
      - "3001:3000"
    depends_on:
      - api-gateway
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    networks:
      - karmyq-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  karmyq-network:
    driver: bridge
